      (function () {

        // 1. Disable Right Click

        // 2. Disable Keyboard Shortcuts

          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + Shift + I (DevTools)
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.keyCode === 73)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }

            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + Shift + C (Inspect Element)

            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + U (View Source)
          if (e.ctrlKey && (e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + S (Save Page)

            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + P (Print)

            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + C (Copy) - Optional: disable copy
          if (e.ctrlKey && (e.key === 'C' || e.keyCode === 67) && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl + A (Select All)
          if (e.ctrlKey && (e.key === 'A' || e.keyCode === 65) && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        });

          return false;
        });

          alert('打印功能已被禁用');

        ].join(';');
